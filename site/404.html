<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Side ikke funnet | ONE-DNA™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #265149;
            --color-secondary: #2f3f45;
            --color-accent: #569e82;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            color: #fff;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        a {
            display: inline-block;
            padding: 0.875rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--color-accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #fff;
            color: var(--color-primary);
        }

        .btn-secondary {
            border: 2px solid #fff;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #fff;
            color: var(--color-primary);
        }

        .logo {
            margin-top: 3rem;
            font-size: 1.25rem;
            font-weight: 800;
            opacity: 0.7;
        }

        .logo span {
            font-size: 0.7em;
            vertical-align: super;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Siden ble ikke funnet</h1>
        <p>
            Beklager, siden du leter etter eksisterer ikke eller har blitt flyttet.
            Gå tilbake til forsiden eller kontakt oss hvis du trenger hjelp.
        </p>
        <div class="links">
            <a href="/no/" class="btn-primary">Gå til forsiden</a>
            <a href="https://www.one-dna.com/contact" class="btn-secondary" target="_blank" rel="noopener">Kontakt oss</a>
        </div>
        <div class="logo">ONE-DNA<span>™</span></div>
    </div>
</body>
</html>
